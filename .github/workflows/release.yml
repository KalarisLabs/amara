name: Release AMARA

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    name: Build Release Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: amara-linux-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: amara-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: amara-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: amara-windows-x64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --bin amara-cli --target ${{ matrix.target }}

      - name: Rename Binary
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv target/${{ matrix.target }}/release/amara-cli.exe ${{ matrix.artifact_name }}
          else
            mv target/${{ matrix.target }}/release/amara-cli ${{ matrix.artifact_name }}
          fi

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
