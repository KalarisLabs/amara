[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "amara-mesh"
version = "0.3.0"
description = "Python SDK for AMARA, the BitChat for AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
dependencies = []

[project.urls]
Homepage = "https://github.com/KalarisLabs/amara"

[tool.setuptools]
py-modules = ["amara"]
