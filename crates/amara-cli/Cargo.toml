[package]
name = "amara-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "AMARA: the BitChat for AI agents. Mesh node, MCP server, HTTP API and CLI."

[[bin]]
name = "amara"
path = "src/main.rs"

[features]
default = []
# Bluetooth LE transport (`amara --ble`).
ble = ["amara-transport/ble"]
# Desktop tray app (`amara tray`).
tray = ["dep:tray-icon", "dep:tao"]

[dependencies]
amara-core = { workspace = true }
amara-crypto = { workspace = true }
amara-mesh = { workspace = true }
amara-transport = { workspace = true }
amara-runtime = { workspace = true }
amara-protocol = { workspace = true }
amara-agent = { workspace = true, features = ["udp"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
futures-util = { workspace = true }
base64 = { workspace = true }
qrcode = { version = "0.14", default-features = false }
tray-icon = { version = "0.26", optional = true }
tao = { version = "0.37", optional = true }
