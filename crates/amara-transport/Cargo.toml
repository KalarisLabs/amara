[package]
name = "amara-transport"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Transport layer abstractions and simulated transport for AMARA"

[dependencies]
amara-core = { workspace = true }
async-trait = "0.1"
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
socket2 = { workspace = true, optional = true }
rand = { workspace = true }


[features]
default = ["udp"]
# Zero-config LAN transport (UDP multicast + unicast).
udp = ["dep:socket2"]
