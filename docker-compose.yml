services:
  amara:
    build: .
    container_name: amara
    # Host networking is required for LAN multicast discovery (Linux hosts).
    network_mode: host
    command: ["up", "--name", "amara-docker", "--api", "127.0.0.1:7432"]
    volumes:
      - amara-data:/home/amara/.amara
    restart: unless-stopped

volumes:
  amara-data:
